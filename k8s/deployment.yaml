            initialDelaySeconds: 15
            periodSeconds: 10

---
# Product Service
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: test2
spec:
  type: ClusterIP
  selector:
    app: product-service
  ports:
    - port: 3001
      targetPort: 3001

