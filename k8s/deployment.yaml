apiVersion: v1
kind: Namespace
metadata:
  name: test2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: test2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
      - name: user-service
        image: test2-user:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: test2
spec:
  selector:
    app: user-service
  ports:
  - port: 3000
    targetPort: 3000
---
apiVersion: apps/v1
