          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: test2
spec:
  selector:
    app: product-service
  ports:
  - port: 3001
    targetPort: 3001
---
